[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aggregate_api"
version = "1.0.0a39"
description = "aggregate Loss Library (aLL): FastAPI service and single-page web app for the aggregate actuarial library."
readme = "README.md"
authors = [
    {name = "Stephen J. Mildenhall", email = "steve@convexrisk.com"},
]
maintainers = [
    {name = "Stephen J. Mildenhall", email = "steve@convexrisk.com"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Framework :: FastAPI",
]
dependencies = [
    # The library this service wraps. The api uses recent internals
    # (aggregate.parser_errors, aggregate.parser._PARSER) that are only
    # present in the in-development 1.0.0a line -- see [tool.uv.sources]
    # below and dev/plan-0001-bootstrap-standalone.md for how the local
    # editable source is wired during co-development.
    "aggregate",
    # Static tables (the author's own package). The api asks it for a semantic
    # table document (the IR), never for markup: the browser owns geometry. The
    # same install also ships the walker that renders that IR, which is what
    # makes version skew between the two impossible. See dev/plan-gt2-ir.md.
    #
    # This is the *new* generation (1.9.0, briefly named `greatest-tables`),
    # which is unpublished and so takes an editable source like `aggregate`
    # does. The name collides with the old PyPI `greater-tables` 5.3, the
    # previous generation of the same package, and the two cannot coexist in one
    # environment. Plain `pip install greater-tables` still resolves to 5.3
    # until 6.0.0 ships, so a deploy without the source below gets 5.3 and dies
    # at import: 5.3 has no `build`, `canonical_json` or `IR_VERSION`.
    "greater-tables",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
]
license = "BSD-3-Clause"
# Was >=3.11 through a31. `greater-tables` declares >=3.13 and that floor is
# the binding one. Nothing in its source needs 3.13, so if 3.11 or 3.12 ever
# matters here again, relax it there rather than pinning an old release here.
requires-python = ">=3.13"

[project.urls]
"Source Code" = "https://github.com/mynl/aggregate_api"

[project.optional-dependencies]
dev = [
    "pytest>=7",
    # FastAPI's TestClient is a thin wrapper over httpx.
    "httpx>=0.27",
    "ruff>=0.6",
]

[project.scripts]
aggregate-api = "aggregate_api.__main__:main"

# ---------------------------------------------------------------------------
# uv source override for co-development.
#
# `aggregate` 1.0.0a* is not published to PyPI, and the api depends on
# internals that exist only in the local working tree. Point uv at that
# tree as an editable install. Edit the path to match your checkout, then
# `uv sync`. plan-0001 settles the canonical path for this machine.
#
# `greater-tables` is unpublished for the same reason and is co-developed
# alongside this repo, so it gets the same treatment. Its checkout folder is
# still named `greatest-tables` after the working name it carried for a day;
# that is deliberate and the path below is correct as written.
# ---------------------------------------------------------------------------
[tool.uv.sources]
aggregate = { path = "../aggregate_REFACTOR", editable = true }
greater-tables = { path = "c:/s/ai/greatest-tables", editable = true }

[tool.setuptools]
include-package-data = true
package-dir = {"" = "src"}
packages = ["aggregate_api", "aggregate_api.routes"]

[tool.setuptools.package-data]
# The built SPA bundle (index.html + assets/) is dropped here by the web
# build and is gitignored; the committed icons/webmanifest ship too.
aggregate_api = ["static/*"]

[tool.ruff]
line-length = 100
