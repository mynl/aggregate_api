[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aggregate_api"
version = "1.0.0"
description = "aggregate Loss Lab (aLL): FastAPI service and single-page web app for the aggregate actuarial library."
readme = "README.md"
authors = [
    {name = "Stephen J. Mildenhall", email = "steve@convexrisk.com"},
]
maintainers = [
    {name = "Stephen J. Mildenhall", email = "steve@convexrisk.com"},
]
keywords = [
    "actuarial",
    "insurance",
    "reinsurance",
    "risk",
    "aggregate loss",
    "compound distribution",
    "FFT",
    "pricing",
    "DecL",
]
classifiers = [
    # Beta rather than Production/Stable at 1.0.0, deliberately. The package is
    # installable and supported; the `/v1` surface still follows what the
    # bundled web app needs, so it is not a frozen interface. The library can
    # claim Production/Stable because its API promise is in force; this cannot
    # yet.
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Framework :: FastAPI",
]
dependencies = [
    # The library this service wraps. An ordinary registry dependency since
    # 1.0.0 of this package: `aggregate` 1.0.1 published on 2026-10-07 and the
    # internals the api imports (`parser_errors`, `parser._PARSER`, `charts`,
    # `exhibits`, `plugins`, `bounds`, `decl_writer`, `constants`) are all in
    # it. Before that the whole 1.0.0a line was unpublished and this had to be
    # an editable path source; see dev/done/plan-1.0.0-release.md.
    #
    # The floor is 1.0.1 and not 1.0.0 because 1.0.0 is not on PyPI at all:
    # the library's own 1.0.1 was a packaging fix, "the wheel ships
    # aggregate.charts, .plots and .exhibits", and the api imports two of those
    # three. A bare `aggregate` would also let a resolver reach 0.30.1, the
    # newest of the old line, which has none of these modules and fails at
    # import rather than at install.
    #
    # The ceiling is caution about two private names, `parser._PARSER` and
    # `parser_errors._TERMINAL_LABELS`. The library's API promise covers its
    # public surface, and a major is exactly where a private name moves.
    # Re-check both at each library minor rather than trusting the range.
    "aggregate>=1.0.1,<2",
    # Static tables (the author's own package). The api asks it for a semantic
    # table document (the IR), never for markup: the browser owns geometry. The
    # same install also ships the walker that renders that IR, which is what
    # makes version skew between the two impossible. See dev/plan-gt2-ir.md.
    #
    # **An ordinary registry dependency since a53.** 6.0.0 has shipped to PyPI,
    # so the editable source this used to carry is gone and a fresh clone works
    # with nothing checked out beside it.
    #
    # The floor is load bearing and must not be relaxed. PyPI also holds 5.3,
    # the previous generation of the same package under the same name, and the
    # two cannot coexist in one environment: 5.3 has no `build`,
    # `canonical_json` or `IR_VERSION`, so resolving to it does not fail at
    # install, it fails at import. Without `>=6` a resolver working around some
    # other constraint could quietly pick it.
    "greater-tables>=6.0.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
]
license = "BSD-3-Clause"
# Was >=3.11 through a31. `greater-tables` declares >=3.13 and that floor is
# the binding one. Nothing in its source needs 3.13, so if 3.11 or 3.12 ever
# matters here again, relax it there rather than pinning an old release here.
requires-python = ">=3.13"

[project.urls]
Homepage = "https://github.com/mynl/aggregate_api"
"Source Code" = "https://github.com/mynl/aggregate_api"
Documentation = "https://github.com/mynl/aggregate_api#readme"
Changelog = "https://github.com/mynl/aggregate_api/blob/main/CHANGELOG.md"
Issues = "https://github.com/mynl/aggregate_api/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7",
    # FastAPI's TestClient is a thin wrapper over httpx.
    "httpx>=0.27",
    "ruff>=0.6",
]
# The resource block of GET /v1/status. An extra rather than a runtime
# dependency so the lean install is untouched and a deployment opts in with
# `uv sync --extra status`; `resources.py` carries a stdlib fallback and says
# which source it used, so the page works either way.
#
# Worth declaring even though psutil is usually already present: it arrives
# transitively through ipython, which aggregate pulls, so the import succeeds
# by accident rather than by intent and is one unrelated dependency change away
# from not. That is what an explicit extra is for.
status = ["psutil>=5.9"]

[project.scripts]
aggregate-api = "aggregate_api.__main__:main"

# ---------------------------------------------------------------------------
# There is deliberately no `[tool.uv.sources]` table.
#
# It held an editable path source for `aggregate` through 1.0.0a202, because the
# whole 1.0.0a line was unpublished, and one for `greater-tables` through a53.
# Both dependencies are on PyPI now, so a fresh clone syncs with nothing checked
# out beside it.
#
# The table has to go rather than merely being unused, because uv honors it when
# this project is installed *as a git dependency* and resolves the relative path
# inside the git repository:
#
#     uv pip install git+https://github.com/mynl/aggregate_api
#     x Failed to download and build `aggregate @ git+...#subdirectory=..\..\worktrees\aggregate_REFACTOR`
#       The source distribution has no subdirectory `..\..\worktrees\aggregate_REFACTOR`
#
# So the table did not just fail to help an outside installer, it was fatal to
# one. pip never saw it, which is why the failure was uv-only and invisible here.
#
# To co-develop either dependency against a local checkout for a session,
# without editing this file:
#
#     uv sync --extra dev                                   # PyPI, the default
#     uv pip install -e V:/worktrees/aggregate_REFACTOR     # swap in the library
#     uv pip install -e c:/s/ai/greatest-tables             # swap in the tables
#
# The tables checkout folder is still named `greatest-tables` after the working
# name it carried for a day; that is deliberate and the path above is correct.
#
# Either swap lasts until the next `uv sync`, which reinstalls from the lock and
# silently puts the released build back without saying so. That matters because
# the release workflow runs `uv sync` on every version bump, so a bump in the
# middle of co-development drops the editable install. `uv run --no-sync` is the
# way to work in between, and it is what this repo uses anyway.
# ---------------------------------------------------------------------------

[tool.setuptools]
include-package-data = true
package-dir = {"" = "src"}
packages = ["aggregate_api", "aggregate_api.routes"]

[tool.setuptools.package-data]
# The built SPA bundle (index.html + assets/) is dropped here by the web
# build and is gitignored; the committed icons/webmanifest ship too.
#
# **`static/assets/*` is a separate entry and must stay one.** A package_data
# glob matches files in one directory and does not recurse, so `static/*` alone
# shipped `index.html` and left every script and stylesheet it loads behind.
# The installed app then served a 200 for `/` and a 404 for all thirteen
# assets: the shell painted and nothing ran. `static/**/*` would also work, and
# is not used here because it would sweep in `static/dev/`, which holds
# development instruments that have no business in a release.
#
# `status_page.html` is the operator's page, served by routes/status.py straight
# out of the package. Deliberately not under `static/`: the web build wipes that
# directory on every run, so a copy there would be deleted by the next deploy,
# and a status page whose delivery depends on the pipeline it reports on cannot
# report on that pipeline failing.
aggregate_api = ["static/*", "static/assets/*", "status_page.html"]

[tool.ruff]
line-length = 100
